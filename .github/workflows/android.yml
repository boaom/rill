name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'capacitor.config.ts'
      - '.github/workflows/android.yml'
      - 'src/**'
      - 'package.json'
      - 'pnpm-lock.yaml'

# Release 需要写 contents；build job 本身只需读。
permissions:
  contents: write

jobs:
  build:
    name: build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build web
        run: pnpm build

      - name: Cap sync android
        run: npx cap sync android

      - name: Assemble debug APK
        run: |
          set -o pipefail
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: APK evidence (aapt2 + zip + size)
        run: |
          set -o pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          AAPT2="$SDK_ROOT/build-tools/36.0.0/aapt2"
          if [ ! -x "$AAPT2" ]; then
            AAPT2="$(find "$SDK_ROOT/build-tools" -type f -name aapt2 | sort -V | tail -n 1)"
          fi
          test -x "$AAPT2"
          {
            echo '## Android debug APK evidence'
            echo '```text'
            "$AAPT2" dump badging "$APK" | grep -E '^(package|minSdkVersion|sdkVersion|targetSdkVersion|uses-permission|application-label:|launchable-activity)' | head -n 15
            echo '```'
            echo '### Web assets / dex present'
            echo '```text'
            unzip -l "$APK" | grep -E 'classes.dex|assets/public/index.html' || exit 1
            echo '```'
            echo '### APK size'
            echo '```text'
            ls -l "$APK"
            echo '```'
          } | tee /tmp/apk-evidence.txt
          cat /tmp/apk-evidence.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: rill-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload APK evidence
        uses: actions/upload-artifact@v4
        with:
          name: rill-apk-evidence
          path: /tmp/apk-evidence.txt
          if-no-files-found: error
          retention-days: 14

  release:
    name: create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download debug APK
        uses: actions/download-artifact@v4
        with:
          name: rill-debug-apk
          path: release

      - name: Download APK evidence
        uses: actions/download-artifact@v4
        with:
          name: rill-apk-evidence
          path: evidence

      - name: Compose release notes
        run: |
          cat > release-body.md <<'EOF'
          ## 溪流 Android APK（debug 构建，run ${{ github.run_number }}）

          ⚠️ 这是**未签名发布版（Android debug 签名）**，不是生产/商店签名。安装需在 Android 设置中允许“未知来源”。

          - **已含设备直连登录（App 内登录 + 手动粘贴兜底）**：原生壳会优先进入设备直连模式，在 App 内打开 m.weibo.cn 登录，用户点“我已登录完成”后读取 Cookie；不依赖本地 server。App 内登录不可用时仍可在同一页面手动粘贴 Cookie。
          - **真实微博未用真实账号端到端验证**：设备直连、App 内登录与手动粘贴共用设备本地 Cookie 路径；本地假上游只验证代码路径，不代表真实站点一定可用。真实账号的读写仍受微博风控与接口变化影响。
          - **debug keystore 不固定**：CI 每次构建可能生成不同的 debug 签名，覆盖安装旧版本时可能需要先卸载。若需要升级保留数据，后续应改为固定签名。
          - 构建提交：`${{ github.sha }}`
          - Web 资源：`dist/` 由 `pnpm build` 生成后经 `npx cap sync android` 打进 APK。
          - 本 Release 为 CI 自动创建；APK 与本次 run 的 artifact 相同。
          EOF
          test -f evidence/apk-evidence.txt
          {
            echo
            echo '## CI APK evidence'
            cat evidence/apk-evidence.txt
          } >> release-body.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-run-${{ github.run_number }}
          name: 溪流 APK v0.1.0 (debug · 设备直连, run ${{ github.run_number }})
          prerelease: true
          body_path: release-body.md
          files: release/app-debug.apk
          fail_on_unmatched_files: true
          token: ${{ secrets.GITHUB_TOKEN }}
