services:
  rill:
    build:
      context: .
      dockerfile: Dockerfile
    image: rill:local
    ports:
      - "8787:8787"
    environment:
      NODE_ENV: production
      RILL_HOST: 0.0.0.0
      RILL_PORT: 8787
      RILL_DB: /app/data/rill.sqlite
      RILL_PROVIDER: ${RILL_PROVIDER:-mock}
      # 不设默认值：没有 32 字节密钥时 compose 直接失败，避免带病启动。
      RILL_SECRET: ${RILL_SECRET:?RILL_SECRET 未设置，先生成 32 字节 base64 密钥}
    volumes:
      - rill-data:/app/data
    restart: unless-stopped

volumes:
  rill-data: