<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>方向 A · 日报 Rill Daily（时间线 / 详情 / 发博）</title>
<style>
/* =====================================================================
   方向 A · 日报 Rill Daily —— 版式家族：黑白栅格 + 巨字日期 + 数据即图形
   form 来自内容的哪里：一天 30 条、12 人、正文普遍只有 2 行短句，
   图片（1–9 张）是唯一"大图形"；所以用"日期做头条 + 数字做图形 +
   四列栅格"把一天排成一版报纸，而不是把每条做成一张卡。
   tokens 覆盖见 tokens.md（本文件顶部的 :root 就是该方向的 tokens.css）
   ===================================================================== */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: #E7E4DE; color: #0B0B0B;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
  -webkit-font-smoothing: antialiased;
}
:root {
  /* —— 颜色（替换 design.md 的 19 个亮色 token，见 tokens.md §1）—— */
  --rill-bg: #FFFFFF; --rill-surface: #FFFFFF; --rill-surface-2: #F1F1EE; --rill-surface-3: #E2E2DE;
  --rill-border: #D6D6D1; --rill-border-strong: #0B0B0B;
  --rill-text: #0B0B0B; --rill-text-2: #46473F; --rill-text-3: #67685F;
  --rill-accent: #C22F1C; --rill-accent-pressed: #97210F; --rill-accent-soft: #FBE9E6; --rill-on-accent: #FFFFFF;
  --rill-like: #C22F1C; --rill-danger: #A52A1B;
  --rill-overlay: rgba(11, 11, 11, .44); --rill-toast-bg: #0B0B0B; --rill-toast-text: #FFFFFF; --rill-focus: #C22F1C;
  /* —— 字阶（15 → 16：移动端正文红线；新增 display 62）—— */
  --rill-fs-11: 12px; --rill-fs-13: 13px; --rill-fs-15: 16px; --rill-fs-17: 17px; --rill-fs-20: 20px; --rill-fs-24: 24px;
  --rill-fs-display: 62px; --rill-fs-num: 25px;
  --rill-lh-tight: 1.4; --rill-lh-normal: 1.75; --rill-lh-relaxed: 1.85;
  --rill-fw-regular: 400; --rill-fw-medium: 500; --rill-fw-semibold: 650;
  /* —— 间距（沿用 12 档，仅把 20 变成版面的 gutter）—— */
  --rill-space-2: 2px; --rill-space-4: 4px; --rill-space-6: 6px; --rill-space-8: 8px; --rill-space-12: 12px;
  --rill-space-16: 16px; --rill-space-20: 20px; --rill-space-24: 24px; --rill-space-32: 32px;
  /* —— 圆角 / 阴影（全部归零：报纸没有圆角）—— */
  --rill-radius-4: 0; --rill-radius-8: 0; --rill-radius-12: 0; --rill-radius-16: 0; --rill-radius-20: 0; --rill-radius-full: 0;
  --rill-border-w: 1px; --rill-shadow-1: none; --rill-shadow-2: none; --rill-shadow-3: 0 16px 40px rgba(11,11,11,.18);
  /* —— 结构尺寸 —— */
  --rill-gutter: 20px; --rill-header-h: 46px; --rill-tabbar-h: 56px; --rill-hit: 44px;
  --rill-card-pad-y: 14px; --rill-card-pad-x: 20px; --rill-media-gap: 1px; --rill-line-clamp: 6;
  --rill-textarea-min: 168px; --rill-compose-bar-h: 56px; --rill-avatar: 36px; --rill-avatar-sm: 28px;
}

/* ============================ 舞台（三屏并排，可选单屏） ============================ */
.stage { display: flex; flex-wrap: wrap; gap: 28px 24px; align-items: flex-start; justify-content: center; padding: 28px 20px 48px; }
.frame { margin: 0; }
.frame .cap { font-size: 12px; letter-spacing: .04em; color: #4A4A46; padding: 0 2px 8px; display: flex; gap: 8px; align-items: baseline; }
.frame .cap b { font-size: 13px; }
.dev {
  width: 375px; height: 812px; border-radius: 26px; overflow: hidden; background: #fff;
  box-shadow: 0 0 0 1px rgba(0,0,0,.10), 0 18px 44px rgba(0,0,0,.16);
}
html.only body { background: var(--rill-bg); }
html.only .stage { display: block; padding: 0; }
html.only .frame { display: none; }
html.only .frame.is-on { display: block; }
html.only .frame .cap { display: none; }
html.only .dev { width: 100vw; height: 100vh; border-radius: 0; box-shadow: none; }

/* ============================ 屏 ============================ */
.screen { container-type: inline-size; width: 100%; height: 100%; position: relative; background: var(--rill-bg); color: var(--rill-text); overflow: hidden; }
.app { height: 100%; display: flex; flex-direction: column; }
.app > * { flex: 0 0 auto; }

/* 四列栅格：唯一没有圆角的"背景装饰" */
.guides { position: absolute; inset: 0; pointer-events: none; background-image: linear-gradient(90deg, rgba(11,11,11,.05) 1px, transparent 1px); background-size: 25% 100%; }

/* 报头 */
.mast { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding: 12px var(--rill-gutter) 8px; position: relative; z-index: 1; }
.mast__mark { font-size: 15px; font-weight: 700; letter-spacing: -.01em; }
.mast__mark span { font-size: 12px; font-weight: 400; letter-spacing: .16em; color: var(--rill-text-3); margin-left: 6px; }
.mast__meta { font-size: 12px; color: var(--rill-text-3); letter-spacing: .02em; }

/* 日期头（该方向的签名） */
.dateline { padding: 0 var(--rill-gutter) 10px; border-bottom: 2px solid var(--rill-text); position: relative; z-index: 1; }
.dateline b { display: block; font-size: var(--rill-fs-display); line-height: .9; font-weight: 650; letter-spacing: -.045em; font-variant-numeric: tabular-nums; }
.dateline em { display: block; margin-top: 6px; font-size: 12px; font-style: normal; color: var(--rill-text-3); letter-spacing: .02em; }

/* 信息流 */
.feed { flex: 1 1 auto; min-height: 0; overflow: hidden; position: relative; z-index: 1; }
.card { padding: var(--rill-card-pad-y) var(--rill-card-pad-x) 0; border-bottom: 1px solid var(--rill-border); }
.card__head { display: flex; align-items: baseline; gap: 8px; }
.card__who { font-size: 16px; font-weight: 600; }
.card__en { font-size: 12px; color: var(--rill-text-3); letter-spacing: .02em; }
.card__time { margin-left: auto; font-size: 12px; color: var(--rill-text-3); font-variant-numeric: tabular-nums; }
.body {
  margin: 7px 0 0; font-size: var(--rill-fs-15); line-height: var(--rill-lh-normal);
  display: -webkit-box; -webkit-line-clamp: var(--rill-line-clamp); -webkit-box-orient: vertical; overflow: hidden;
}
.more { display: inline-block; margin-top: 4px; font-size: 12px; color: var(--rill-text); border-bottom: 1px solid currentColor; padding-bottom: 1px; }
/* 图格：1 张 / 2 张 / 3 张 / 4 张 / 9 张，全靠 1px 黑缝 */
.figs { display: grid; gap: var(--rill-media-gap); background: var(--rill-text); margin-top: 10px; }
.figs[data-n="1"] { grid-template-columns: 1fr; }
.figs[data-n="1"] .ph { aspect-ratio: 16 / 9; }
.figs[data-n="2"] { grid-template-columns: 1fr 1fr; }
.figs[data-n="2"] .ph { aspect-ratio: 1 / 1; }
.figs[data-n="3"] { grid-template-columns: repeat(3, 1fr); }
.figs[data-n="3"] .ph { aspect-ratio: 1 / 1; }
.figs[data-n="4"] { grid-template-columns: 1fr 1fr; }
.figs[data-n="4"] .ph { aspect-ratio: 1 / 1; }
.figs[data-n="9"] { grid-template-columns: repeat(3, 1fr); }
.figs[data-n="9"] .ph { aspect-ratio: 1 / 1; }
/* 照片位：程序化材质，色相取自 mock.json 的 media.hue */
.ph { position: relative; overflow: hidden;
  background: radial-gradient(120% 120% at 26% 16%, hsl(var(--h) 42% 90%) 0%, hsl(var(--h) 32% 77%) 46%, hsl(var(--h) 26% 63%) 100%), hsl(var(--h) 28% 76%); }
.ph::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(255,255,255,.16), rgba(0,0,0,.07)); }
.ph i { position: absolute; left: 6px; bottom: 6px; z-index: 1; font-size: 12px; font-style: normal; padding: 1px 6px;
  background: rgba(10,12,14,.62); color: #fff; letter-spacing: .01em; }
/* 转发：缩进 + 2px 墨线，只画"谁在说谁" */
.quote { margin-top: 10px; padding-left: 12px; border-left: 2px solid var(--rill-text); }
.quote__head { font-size: 12px; color: var(--rill-text-2); }
.quote__head b { font-size: 13px; color: var(--rill-text); font-weight: 600; }
.quote__body { margin: 4px 0 0; font-size: var(--rill-fs-15); line-height: var(--rill-lh-normal); }
.quote__meta { margin-top: 5px; font-size: 12px; color: var(--rill-text-3); font-variant-numeric: tabular-nums; display: flex; gap: 12px; }
/* 计数行 = 行内操作（并入 C4 的行内动作），数字是图形的一部分 */
.counts { display: flex; gap: 18px; padding: 4px 0 6px; }
.counts button { all: unset; display: inline-flex; align-items: center; justify-content: flex-start; gap: 5px; min-height: 44px; min-width: 44px; cursor: pointer; color: var(--rill-text-2); }
.counts svg { width: 18px; height: 18px; }
.counts b { font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -.01em; color: var(--rill-text); }
.counts .is-on { color: var(--rill-accent); }
.counts .is-on b { color: var(--rill-accent); }
.counts .big b { font-size: 22px; }

/* tabbar：纯文字，2px 墨线 + 强调色下划线（无图标库，也不画图标） */
.tabs { height: var(--rill-tabbar-h); display: grid; grid-template-columns: repeat(4, 1fr); border-top: 2px solid var(--rill-text); background: var(--rill-surface); padding: 0 var(--rill-gutter); }
.tabs a { display: grid; place-items: center; font-size: 12px; color: var(--rill-text-3); text-decoration: none; }
.tabs a.is-on { color: var(--rill-text); font-weight: 600; box-shadow: inset 0 -2px 0 var(--rill-accent); }

/* 底部读数条：把"数据即图形"从卡片内搬到版面上 */
.statbar { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1px; margin-top: 0; background-color: var(--rill-statbar-bg); }
.statbar div { background: var(--rill-statbar-bg); padding: 9px 0 10px; text-align: center; }
.statbar b { display: block; font-size: 22px; line-height: 1; font-weight: 650; letter-spacing: -.03em; font-variant-numeric: tabular-nums; color: var(--rill-statbar-fg); }
.statbar i { display: block; margin-top: 5px; font-style: normal; font-size: 12px; color: var(--rill-statbar-label); }

/* ---------------- 详情 ---------------- */
.dtop { display: flex; align-items: baseline; justify-content: space-between; padding: 10px var(--rill-gutter); border-bottom: 1px solid var(--rill-text); }
.dtop a { display: inline-flex; align-items: center; min-height: 44px; font-size: 12px; color: var(--rill-text-2); text-decoration: none; }
.dtop h1 { margin: 0; font-size: 17px; font-weight: 650; letter-spacing: .02em; }
.dtop h1 em { font-style: normal; font-size: 12px; font-weight: 400; color: var(--rill-text-3); letter-spacing: .12em; margin-left: 6px; }
.dbody { padding: 14px var(--rill-gutter) 0; }
.replies { border-top: 1px solid var(--rill-text); margin-top: 14px; }
.replies__h { display: flex; justify-content: space-between; padding: 9px var(--rill-gutter) 4px; font-size: 12px; color: var(--rill-text-3); }
.reply { display: grid; grid-template-columns: 24px 1fr; gap: 10px; padding: 10px var(--rill-gutter); border-bottom: 1px solid var(--rill-border); }
.reply__n { font-size: 12px; color: var(--rill-text-3); font-variant-numeric: tabular-nums; padding-top: 1px; }
.reply__head { display: flex; align-items: baseline; gap: 6px; }
.reply__cn { font-size: 13px; font-weight: 600; }
.reply__en { font-size: 12px; color: var(--rill-text-3); }
.reply__to { font-size: 12px; color: var(--rill-text-2); font-weight: 600; }
.reply__body { margin: 4px 0 0; font-size: var(--rill-fs-15); line-height: var(--rill-lh-normal); }
.rbar { height: var(--rill-compose-bar-h); display: flex; align-items: center; gap: 10px; padding: 0 var(--rill-gutter); border-top: 2px solid var(--rill-text); background: var(--rill-surface); }
.rbar .hint { flex: 1; font-size: 12px; color: var(--rill-text-3); }
.rbar .send { font-size: 12px; letter-spacing: .08em; color: #fff; background: var(--rill-text); padding: 4px 12px; }

/* ---------------- 发博 ---------------- */
.compose { flex: 1; display: flex; flex-direction: column; }
.compose__hd { padding: 14px var(--rill-gutter) 0; }
.compose__hd b { display: block; font-size: 32px; line-height: 1.05; font-weight: 650; letter-spacing: -.03em; }
.compose__hd em { display: block; margin-top: 4px; font-size: 12px; font-style: normal; color: var(--rill-text-3); }
.steps { display: flex; gap: 12px; padding: 10px var(--rill-gutter) 0; font-size: 12px; color: var(--rill-text-3); }
.steps i { font-style: normal; }
.steps .is-on { color: var(--rill-text); font-weight: 600; }
/* 横线稿纸 = 编辑部的写作区 */
.paper { margin: 10px var(--rill-gutter) 0; flex: 1; min-height: var(--rill-textarea-min); background-image: repeating-linear-gradient(180deg, transparent 0, transparent 27px, var(--rill-border) 27px, var(--rill-border) 28px); }
.paper p { margin: 0; font-size: var(--rill-fs-15); line-height: 28px; color: var(--rill-text-3); }
.paper p b { font-weight: 400; color: var(--rill-text); }
.cursor { display: inline-block; width: 1px; height: 18px; background: var(--rill-accent); vertical-align: -3px; margin-left: 1px; }
.slots { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--rill-text); margin: 14px var(--rill-gutter) 0; }
.slot { aspect-ratio: 1 / 1; background: var(--rill-surface-2); display: grid; place-items: center; position: relative; }
.slot svg { width: 22px; height: 22px; color: var(--rill-text-3); }
.slot--filled { background: transparent; }
.slot--filled .ph { position: absolute; inset: 0; }
.slot--filled .ph i { display: none; }
.topicrow { display: flex; align-items: center; gap: 8px; padding: 12px var(--rill-gutter) 0; }
.topicrow span { font-size: 12px; color: var(--rill-text-3); }
.topicrow b { font-size: 12px; color: var(--rill-accent); border: 1px solid var(--rill-accent); padding: 2px 8px; font-weight: 400; }
.pubbar { height: var(--rill-compose-bar-h); display: flex; align-items: center; gap: 10px; padding: 0 var(--rill-gutter); border-top: 2px solid var(--rill-text); background: var(--rill-surface); }
.pubbar .count { font-size: 12px; color: var(--rill-text-3); font-variant-numeric: tabular-nums; }
.pubbar .pub { margin-left: auto; font-size: 13px; font-weight: 600; color: var(--rill-pub-fg); background: var(--rill-pub-bg); padding: 8px 20px; min-height: 44px; }

/* ============================ 1440：日报桌面版 ============================ */
.side { display: none; }

@container (min-width: 900px) {
  .side { display: block; grid-column: 3; grid-row: 2; padding-top: 18px; }
  .statbar { display: none; }   /* 桌面端读数只留右栏「今日读数」，不重复 */
  .app { display: grid; grid-template-columns: 300px minmax(0, 1fr) 260px; grid-template-rows: auto minmax(0, 1fr); column-gap: 32px; padding: 0 40px; }
  .mast { grid-column: 1 / -1; padding: 22px 0 12px; border-bottom: 2px solid var(--rill-text); }
  .mast__mark { font-size: 20px; }
  .mast__mark span { font-size: 12px; letter-spacing: .22em; }
  .dateline { grid-column: 1; grid-row: 2; border-bottom: 0; padding: 18px 0 0; }
  .dateline b { font-size: 96px; }
  .dateline em { font-size: 12px; margin-top: 10px; }
  .feed { grid-column: 2; grid-row: 2; padding-top: 18px; display: grid; grid-template-columns: 1fr 1fr; gap: 0 28px; align-content: start; }
  .feed .card { border-bottom: 1px solid var(--rill-border); padding: 0 0 18px; margin-bottom: 18px; }
  .feed .card:first-child { grid-column: 1 / -1; }
  .feed .card:first-child .figs { max-width: 420px; }
  .railed { grid-column: 3; grid-row: 2; padding-top: 18px; }
  .tabs { grid-column: 1 / -1; height: 52px; margin: 0 -40px; padding: 0 40px; grid-template-columns: repeat(4, max-content); gap: 32px; }
  .tabs a { place-items: center start; }
  .side h4 { margin: 0 0 10px; font-size: 12px; letter-spacing: .08em; color: var(--rill-text-3); font-weight: 500; }
  .side dl { margin: 0; display: grid; grid-template-columns: 1fr auto; gap: 8px 12px; font-size: 13px; }
  .side dt { color: var(--rill-text-2); }
  .side dd { margin: 0; font-variant-numeric: tabular-nums; font-weight: 600; }
  .side .rule { height: 1px; background: var(--rill-border); margin: 16px 0; }
  /* 详情：左栏作者 + 正文 620 + 右栏回复 */
  .dtop { grid-column: 1 / -1; border-bottom: 2px solid var(--rill-text); }
  .dbody { grid-column: 1 / 3; padding: 20px 0 0; }
  .dbody .figs { max-width: 520px; }
  .replies { grid-column: 3; grid-row: 2 / 4; margin-top: 20px; border-top: 1px solid var(--rill-text); }
  .rbar { grid-column: 1 / -1; margin: 0 -40px; padding: 0 40px; }
  /* 发博：左栏步骤 + 中间稿纸 + 右栏槽位 */
  .compose__hd { grid-column: 1 / -1; padding: 24px 0 0; }
  .compose__hd b { font-size: 56px; }
  .steps { grid-column: 1 / -1; padding: 14px 0 0; gap: 24px; }
  .paper { grid-column: 1 / 3; margin: 18px 0 0; }
  .slots { grid-column: 3; grid-row: 3; margin: 18px 0 0; align-self: start; }
  .topicrow { grid-column: 1 / 3; padding: 14px 0 0; }
  .pubbar { grid-column: 1 / -1; margin: 0 -40px; padding: 0 40px; }
}
:root {
  /* 读数条与发布块的反相成对变量（亮/暗各一套，避免手写 #fff 在暗色下翻车）*/
  --rill-statbar-bg:#0B0B0B; --rill-statbar-fg:#FFFFFF; --rill-statbar-label:#C9C9C4;
  --rill-pub-bg:#0B0B0B; --rill-pub-fg:#FFFFFF;
}

/* ===== 暗色（?theme=dark）===== */
html[data-theme="dark"] {
  --rill-bg:#0C0C0C; --rill-surface:#121212; --rill-surface-2:#1A1A19; --rill-surface-3:#242422;
  --rill-border:#333331; --rill-border-strong:#EDEDED;
  --rill-text:#EDEDED; --rill-text-2:#B4B4AE; --rill-text-3:#8E8E86;
  --rill-accent:#FF6B4A; --rill-accent-pressed:#FF8A6E; --rill-accent-soft:#2A1612; --rill-on-accent:#0C0C0C;
  --rill-like:#FF6B4A; --rill-danger:#FF7A6B; --rill-overlay:rgba(0,0,0,.62);
  --rill-toast-bg:#EDEDED; --rill-toast-text:#0C0C0C; --rill-focus:#FF6B4A;
  --rill-statbar-bg:#EDEDED; --rill-statbar-fg:#0C0C0C; --rill-statbar-label:#4A4A44;
  --rill-pub-bg:#EDEDED; --rill-pub-fg:#0C0C0C;
  --rill-shadow-3:0 16px 40px rgba(0,0,0,.55);
}
html[data-theme="dark"] .ph::after { background: linear-gradient(180deg, rgba(0,0,0,.10), rgba(0,0,0,.44)); }
html[data-theme="dark"] .tab { border-color: var(--rill-border); }


/* 长文：段落之间留白，靠 data-expanded 切换折叠 */
.body .para { display: block; }
.body .para + .para { margin-top: 10px; }
.card[data-expanded="true"] .body { -webkit-line-clamp: unset; display: block; }
.card[data-expanded="true"] .body .para + .para { margin-top: 12px; }
.card[data-expanded="true"] .more { display: none; }
/* 折叠态：限量显示图（t25 修正 t22 的"完全不渲染"）——最多一行 3 张，横向裁列不裁图 */
.card[data-longtext]:not([data-expanded="true"]) .figs { grid-template-columns: repeat(3, 1fr); }
.card[data-longtext]:not([data-expanded="true"]) .figs > .ph:nth-child(n+4) { display: none; }
.card[data-longtext]:not([data-expanded="true"]) .figs > .ph { aspect-ratio: 1 / 1; }
/* 折叠态段落间隙归零：让 clientHeight 严格 = 6 × line-height（实测带宽 10px 间隙时是 188 = 168+20） */
.card[data-longtext]:not([data-expanded="true"]) .body .para + .para { margin-top: 0; }
/* 展开态：全量 3×3（9 格完整，不切图） */
.card[data-expanded="true"] .figs { grid-template-columns: repeat(3, 1fr); }
.more { font: inherit; border: 0; background: none; cursor: pointer; padding: 0; min-height: 44px; text-align: left; }
/* 详情长文：不折叠，17/1.6（与 design.md 的详情正文口径一致） */
.dbody--long .body { font-size: 17px; line-height: 1.6; -webkit-line-clamp: unset; display: block; }
/* 三态（空 / 错误 / 离线） */
.state { padding: 56px var(--rill-gutter); text-align: center; }
.state b { display: block; font-size: 20px; font-weight: 600; letter-spacing: -.01em; }
.state p { margin: 10px 0 0; font-size: 13px; color: var(--rill-text-2); line-height: 1.75; }
.state .box { margin: 22px 0 0; border: 1px solid var(--rill-border-strong); padding: 22px 16px; }
.state button { margin-top: 18px; min-height: 44px; padding: 0 22px; font: inherit; font-size: 14px; font-weight: 600; color: var(--rill-pub-fg); background: var(--rill-pub-bg); border: 0; cursor: pointer; }
.offline { display: flex; align-items: center; gap: 8px; padding: 0 var(--rill-gutter); height: 30px; background: var(--rill-text); color: var(--rill-bg); font-size: 12px; }
</style>
</head>
<body>
<div class="stage">

<!-- ============================ 1 · 时间线 ============================ -->
<figure class="frame" data-screen="timeline">

  <div class="dev">
    <div class="screen">
      <div class="guides" aria-hidden="true"></div>
      <div class="app">
        <header class="mast">

          <div class="mast__meta">2026 周一 · 30 条 / 12 人</div>
        </header>
        <div class="dateline">
          <b>11.16</b>
          <em>星期一 · 关注 · 每 5 条一条日期线</em>
        </div>
        <main class="feed">
          <!-- 九宫格：9 张全可见（微博上限 9，不允许用 +N 掩盖） -->
          <article class="card" data-card data-post-id="p_0007" data-longtext>
            <div class="card__head" data-part="author">
              <span class="card__who">摄影笔记</span><span class="vm" data-verified="true" aria-label="已认证"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.4 6.4 4.6 8.6 9.6 3.6"/></svg></span><span class="card__en">shutterlog</span>
              <span class="card__time">09:42</span><span class="card__src" data-source>来自 iPhone 15 Pro Max</span>
            </div>
            <p class="body" data-part="body" data-clamped="6" data-testid="post-text"><span class="para">这两年我慢慢发现，记录本身比记录的内容更重要。</span>
<span class="para">一开始只是随手拍，后来变成每天走同一条路都会下意识找角度：树叶的影子、公交车进站的那两秒、便利店门口的灯。</span>
<span class="para">最大的变化是不太着急了。以前总想一次拍到最好的一张，现在更愿意在同一个路口站十分钟，等光慢慢挪过来。</span>
<span class="para">拍得多了才明白，所谓手感其实就是熟悉——熟悉这条街什么时候安静，熟悉哪一段墙在下午会发亮。</span>
<span class="para">如果你也在做类似的练习，欢迎来聊 @citywalk 。往期整理放在 https://t.cn/A6xYz123</span>
<span class="para">#城市散步#</span></p>
            <button class="more" data-testid="expand-text" type="button">展开全文</button>
            <div class="figs" data-part="media" data-n="9" data-testid="post-media"><div class="ph" style="--h:94"></div><div class="ph" style="--h:131"></div><div class="ph" style="--h:168"></div><div class="ph" style="--h:205"></div><div class="ph" style="--h:242"></div><div class="ph" style="--h:279"></div><div class="ph" style="--h:316"></div><div class="ph" style="--h:353"></div><div class="ph" style="--h:390"></div></div>
            <div class="counts" data-part="counts" data-testid="post-counts">
              <button><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 8.5h10.6"/><path d="M14.2 5.4l3.2 3.1-3.2 3.1"/><path d="M17.5 15.5H6.9"/><path d="M9.8 12.4 6.6 15.5l3.2 3.1"/></svg><b>6</b></button>
              <button><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12.3c0 3.6-3.6 6.4-8 6.4-1 0-2-.2-2.9-.5L5 20l1.1-3.4A6.3 6.3 0 0 1 4 12.3C4 8.7 7.6 6 12 6s8 2.7 8 6.3z"/></svg><b>2</b></button>
              <button><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19.4S4.6 14.9 4.6 9.9A4 4 0 0 1 12 7.5a4 4 0 0 1 7.4 2.4c0 5-7.4 9.5-7.4 9.5z"/></svg><b>47</b></button>
            </div>
          </article>
          <div class="statbar" data-part="counts2" aria-hidden="true">
            <div><b>30</b><i>条</i></div>
            <div><b>100</b><i>图</i></div>
          </div>
        </main>
        <aside class="side" aria-hidden="true">
          <h4>今日读数</h4>
          <dl>
            <dt>博文</dt><dd>30</dd>
            <dt>作者</dt><dd>12</dd>
            <dt>回复</dt><dd>60</dd>
            <dt>图片</dt><dd>100</dd>
            <dt>带图 / 纯文字</dt><dd>22 / 8</dd>
          </dl>
          <div class="rule"></div>
          <h4>常去话题</h4>
          <dl>
            <dt>#雨后散步#</dt><dd>2</dd>
            <dt>#城市散步#</dt><dd>2</dd>
            <dt>#随手拍#</dt><dd>2</dd>
            <dt>#晚风#</dt><dd>2</dd>
            <dt>#一杯茶#</dt><dd>1</dd>
          </dl>
          <div class="rule"></div>
          <h4>相对时间</h4>

            <dt>今天</dt><dd>6</dd>
            <dt>昨天</dt><dd>18</dd>
            <dt>更早</dt><dd>4</dd>

        <nav class="tabs">
          <a href="#" class="is-on">时间线</a><a href="#">发博</a><a href="#">我的</a><a href="#">设置</a>
        </nav>
      </div>
    </div>
  </div>
</figure>

<!-- ============================ 2 · 详情 ============================ -->
<figure class="frame" data-screen="detail">
  <div class="cap"><b>A · 日报</b><span>详情 · 375</span></div>
  <div class="dev">
    <div class="screen">
      <div class="guides" aria-hidden="true"></div>
      <div class="app">
        <div class="dtop">
          <a href="#">← 时间线</a>
          <h1>详情<em>detail</em></h1>
        </div>
        <div class="dbody">
          <div class="card__head" data-part="author">
            <span class="card__who">沉舟</span><span class="vm" data-verified="true" aria-label="已认证"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.4 6.4 4.6 8.6 9.6 3.6"/></svg></span><span class="card__en">chenzhou</span>
            <span class="card__time">昨天 22:58</span><span class="card__src" data-source>来自 iPhone 15 Pro</span>
          </div>
          <p class="body" data-part="body" style="margin-top:8px">看到就转了，值得留一份。</p>
          <div class="quote" data-part="media">
            <div class="quote__head"><b>江余</b> jiangyu · 昨天 20:58</div>
            <p class="quote__body">地铁上有人让了座，很普通的一件事，让整节车厢都柔和了一点。</p>
            <div class="quote__meta"><span>转发 3</span><span>回复 1</span><span>赞 20</span></div>
          </div>
          <div class="counts big" data-part="counts" style="margin-top:2px">
            <button><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 8.5h10.6"/><path d="M14.2 5.4l3.2 3.1-3.2 3.1"/><path d="M17.5 15.5H6.9"/><path d="M9.8 12.4 6.6 15.5l3.2 3.1"/></svg><b>1</b></button>
            <button><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12.3c0 3.6-3.6 6.4-8 6.4-1 0-2-.2-2.9-.5L5 20l1.1-3.4A6.3 6.3 0 0 1 4 12.3C4 8.7 7.6 6 12 6s8 2.7 8 6.3z"/></svg><b>3</b></button>
            <button class="is-on"><svg viewBox="0 0 24 24" fill="currentColor" stroke="none" aria-hidden="true"><path d="M12 19.4S4.6 14.9 4.6 9.9A4 4 0 0 1 12 7.5a4 4 0 0 1 7.4 2.4c0 5-7.4 9.5-7.4 9.5z"/></svg><b>126</b></button>
          </div>
        </div>
        <div class="replies">
          <div class="replies__h"><span>回复</span><span>3 条</span></div>
          <div class="reply">
            <div class="reply__n">01</div>
            <div>
              <div class="reply__head"><span class="reply__cn">城市漫游</span><span class="reply__en">citywalk</span></div>
              <p class="reply__body">下次一起去。</p>
            </div>
          </div>
          <div class="reply">
            <div class="reply__n">02</div>
            <div>
              <div class="reply__head"><span class="reply__cn">周迟</span><span class="reply__en">zhouchi</span></div>
              <p class="reply__body">我也有同感。</p>
            </div>
          </div>
          <div class="reply">
            <div class="reply__n">03</div>
            <div>
              <div class="reply__head"><span class="reply__cn">苏未</span><span class="reply__en">suwei</span></div>
              <p class="reply__body">下次一起去。</p>
            </div>
          </div>
        </div>
        <div class="rbar"><span class="hint">说点什么</span><span class="send">发送</span></div>
      </div>
    </div>
  </div>
</figure>

<!-- ============================ 3 · 发博 ============================ -->
<figure class="frame" data-screen="compose">
  <div class="cap"><b>A · 日报</b><span>发博 · 375</span></div>
  <div class="dev">
    <div class="screen">
      <div class="guides" aria-hidden="true"></div>
      <div class="app">
        <div class="dtop">
          <a href="#">← 放弃</a>
          <h1>发博<em>compose</em></h1>
        </div>
        <div class="compose">
          <div class="compose__hd">
            <b>写下</b>
            <em>今天发生了什么？一句话就够。</em>
          </div>
          <div class="steps"><i class="is-on">01 正文</i><i>02 图片</i><i>03 话题</i></div>
          <div class="paper">
            <p><b>雨停之后又绕了一段路</b><span class="cursor"></span></p>
            <p>&nbsp;</p>
            <p>&nbsp;</p>
          </div>
          <div class="slots">
            <div class="slot slot--filled"><div class="ph" style="--h:57"></div></div>
            <div class="slot slot--filled"><div class="ph" style="--h:110"></div></div>
            <div class="slot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8.5h3.2L9 6h6l1.8 2.5H20a1 1 0 0 1 1 1V19a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9.5a1 1 0 0 1 1-1z"/><circle cx="12" cy="13.5" r="3.4"/></svg></div>
          </div>
          <div class="topicrow"><span>话题</span><b>#雨后散步#</b></div>
        </div>
        <div class="pubbar"><span class="count">13 / 2000 · 2 张图</span><button class="pub">发布</button></div>
      </div>
    </div>
  </div>
</figure>

</div>
<script>
  // 单屏模式：?only=timeline|detail|compose —— 截图用（375 真机 / 1440 桌面）
  const qs = new URLSearchParams(location.search);
  const theme = qs.get('theme');            // ?theme=dark|light —— 主题截图用
  if (theme === 'dark' || theme === 'light') document.documentElement.dataset.theme = theme;
  const only = qs.get('only');
  const expand = qs.get('expand') === '1';   // 展开态
  const longtext = qs.get('longtext') === '1'; // 详情页长文（不折叠）
  const state = qs.get('state');             // empty | error | offline
  if (only) {
    document.documentElement.classList.add('only');
    if (qs.get('short') === '1') {   // 带图短帖：32 字 + 9 图，验证"放得下就全量"
    const c = document.querySelector('.card[data-longtext]');
    if (c) {
      c.removeAttribute('data-longtext');
      const b = c.querySelector('.body');
      b.textContent = '雨停之后又绕了一段路，路面的水洼把整条街的灯都翻了一遍。';
      b.removeAttribute('data-clamped');
      const m = c.querySelector('.more'); if (m) m.remove();
    }
  }
  if (expand) document.querySelectorAll('.card[data-longtext]').forEach(c => c.dataset.expanded = 'true');
  if (longtext) {
    // 详情页长文：不折叠（无 data-clamped），17px / 1.6
    const src = document.querySelector('.card[data-longtext] .body');
    const dbody = document.querySelector('.frame[data-screen="detail"] .dbody');
    if (src && dbody) {
      dbody.classList.add('dbody--long');
      const q = dbody.querySelector('.quote'); if (q) q.remove();
      const b = document.createElement('p');
      b.className = 'body'; b.setAttribute('data-testid', 'post-text');
      b.innerHTML = src.innerHTML;
      dbody.insertBefore(b, dbody.querySelector('.counts'));
      const head = dbody.querySelector('.card__head');
      if (head) head.innerHTML = document.querySelector('.card[data-longtext] .card__head').innerHTML;
      document.querySelectorAll('.replies').forEach(r => r.style.display = 'none');
    }
  }
  if (state) {
    const feed = document.querySelector('.frame[data-screen="timeline"] .feed');
    const T = {
      empty: ['今天的版面上还空着', '关注的人今天还没出声。去写一条，或者换到「推荐」看看。', '去写一条'],
      error: ['这一版没拿到', '网络没有回应。手上的存档还在，稍后再试一次。', '重试'],
      offline: ['离线 · 显示本地存档', '你在离线状态，看到的是上次打开的版面。', '知道了']
    }[state];
    if (feed && T) {
      feed.innerHTML = `<div class="state" data-state="${state}"><div class="box"><b>${T[0]}</b><p>${T[1]}</p><button>${T[2]}</button></div></div>`;
      if (state === 'offline') {
        const app = document.querySelector('.frame[data-screen="timeline"] .app');
        const bar = document.createElement('div');
        bar.className = 'offline'; bar.setAttribute('data-state', 'offline');
        bar.innerHTML = '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M3 3l18 18"/><path d="M5 12.5a9 9 0 0 1 4-2.2"/><path d="M2.6 8.6a14 14 0 0 1 3.6-2.3"/><path d="M11.4 8.2a14 14 0 0 1 10 3.6"/><circle cx="12" cy="18" r="1.4"/></svg><span>离线 · 显示本地存档</span>';
        app.insertBefore(bar, app.querySelector('.feed'));
      }
    }
  }
  const f = document.querySelector(`.frame[data-screen="${only}"]`);
    if (f) f.classList.add('is-on');
  }
</script>
</body>
</html>
